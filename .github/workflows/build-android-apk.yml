name: Build NEXORA Android APK & AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version label for output filenames (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      publish_release:
        description: 'Publish compiled APK/AAB directly to GitHub Releases'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Debug APK, Release APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Verify TypeScript types
        run: npm run lint

      - name: Clean temporary local archives and chat attachments before Capacitor sync
        run: rm -rf public/*.zip public/assets/aistudio

      - name: Build production web bundle
        run: npm run build

      - name: Sync Capacitor Android native project
        run: npx cap sync android

      - name: Decode Release Keystore (when configured in GitHub Secrets)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/android/nexora-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded — Release APK and Play Store AAB will be signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secrets configured — Debug APK is directly installable; Release APK/AAB will be built unsigned."
          fi

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (Installable directly on Android devices)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK & Play Store Release AAB
        working-directory: android
        env:
          NEXORA_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/android/nexora-release.jks', github.workspace) || '' }}
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect and rename build outputs
        id: artifacts
        env:
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          mkdir -p build-outputs

          if [ -n "$TAG_NAME" ]; then
            VERSION="${TAG_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$DEBUG_APK" "build-outputs/nexora-v${VERSION}-debug.apk"

          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "build-outputs/nexora-v${VERSION}-release-signed.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release-unsigned.apk" "build-outputs/nexora-v${VERSION}-release-unsigned.apk"
          fi

          RELEASE_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" "build-outputs/nexora-v${VERSION}-release.aab"
          fi

          ls -lh build-outputs/

      - name: Upload Debug APK Artifact (Ready to Install on Android)
        uses: actions/upload-artifact@v7
        with:
          name: nexora-android-debug-apk
          path: build-outputs/*-debug.apk
          retention-days: 30

      - name: Upload Release APK & Play Store AAB Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nexora-android-release-bundle
          path: |
            build-outputs/*-release*.apk
            build-outputs/*-release.aab
          retention-days: 30

      - name: Publish Versioned GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build-outputs/*
          generate_release_notes: true

      - name: Publish Rolling Latest Android APK Release (on main/master or manual dispatch)
        if: |
          !startsWith(github.ref, 'refs/tags/v') &&
          (github.event_name == 'push' || inputs.publish_release == true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          name: NEXORA v${{ steps.artifacts.outputs.version }} (Latest Android APK)
          body: |
            Automated Android build from commit `${{ github.sha }}`.

            ### Direct Android Installation
            - Download **`nexora-v${{ steps.artifacts.outputs.version }}-debug.apk`** below and tap it on your Android device to install immediately.
            - If release signing secrets are configured in GitHub Actions, **`nexora-v${{ steps.artifacts.outputs.version }}-release-signed.apk`** and **`nexora-v${{ steps.artifacts.outputs.version }}-release.aab`** are also included below.
          files: build-outputs/*
          make_latest: true
